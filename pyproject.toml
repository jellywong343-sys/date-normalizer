[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "date-normalizer"
version = "1.0.0"
description = "Normalize mixed date formats in CSV columns while preserving invalid values in a review report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jellywong343-sys" }]
dependencies = []
keywords = ["python","dates","csv","data-cleaning","cli"]

[project.scripts]
date-normalize = "date_normalizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
